# HF: https://huggingface.co/unsloth/gemma-4-E4B-it-qat-GGUF
# Fast vision/voice/tools enabled assistant
# Example config for AMD RX 6600 + Ryzen 5 5600 + 64GB DDR4
#
services:
  glacierflow-llamacpp:
    devices:
      - "/dev/dri/renderD128:/dev/dri/renderD128"
    command: >
      --batch-size 2048
      --ctx-size 131072
      --flash-attn on
      --host 0.0.0.0
      --image-max-tokens 1120
      --image-min-tokens 1120
      --min-p 0.05
      --mmproj /models/unsloth/gemma-4-E4B-it-qat-GGUF/mmproj-F32.gguf
      --model /models/unsloth/gemma-4-E4B-it-qat-GGUF/gemma-4-E4B-it-qat-UD-Q4_K_XL.gguf
      --gpu-layers 999
      --no-mmap
      --parallel 1
      --port 8080
      --presence-penalty 0.0
      --reasoning on
      --repeat-penalty 1.1
      --seed 42
      --temp 1.0
      --threads 6
      --top-k 64
      --top-p 0.95
      --ubatch-size 2048
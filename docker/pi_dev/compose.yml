services:
  glacierflow-pi-dev:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        GF_USER_ID: "${GF_USER_ID:-1000}"
        GF_PI_EXTRA_PACKAGES: ${GF_PI_EXTRA_PACKAGES:-}
    container_name: "glacierflow-pi-dev"
    environment:
      - EDITOR=vim
      - GF_PI_DEV_TTYD_PASSWORD=${GF_HTTP_PASSWORD:-glacierflow}
      - GF_PI_DEV_TTYD_USER=${GF_HTTP_USER:-glacierflow}
      - GF_USER_GROUP_ID=${GF_USER_GROUP_ID:-1000}
      - GF_USER_ID=${GF_USER_ID:-1000}
    user: "${GF_USER_ID:-1000}:${GF_USER_GROUP_ID:-1000}"
    volumes:
      - ./:/pi_dev:ro
      - ./../../data/pi_dev/config:/home/pi_dev/.pi:rw
      - ./../../data/pi_dev/scripts:/pi_dev_scripts:rw
      - ./../../data/pi_dev/tmux.conf:/home/pi_dev/.tmux.conf:ro
      - ${GF_PI_DEV_WORKDIR:-./../../data/pi_dev/workdir}:/home/pi_dev/workdir:rw
    restart: no
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "pi", "--version" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
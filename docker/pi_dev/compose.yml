services:
  glacierflow-pi-dev:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: "glacierflow-pi-dev"
    environment:
      - EDITOR=vim
    user: "1000:1000"
    volumes:
      - ./:/pi_dev:ro
      - ./../../data/pi_dev/config:/home/pi_dev/.pi:rw
      - ./../../data/pi_dev/scripts:/pi_dev_scripts:rw
      - ${GF_PI_DEV_WORKDIR:-./../../data/pi_dev/workdir}:/home/pi_dev/workdir:rw
    restart: no
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "pi", "--version" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 10s
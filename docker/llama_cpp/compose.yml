services:
  glacierflow-llamacpp:
    # releases page:
    # https://github.com/ggml-org/llama.cpp/pkgs/container/llama.cpp/versions?filters%5Bversion_type%5D=tagged
    image: ghcr.io/ggml-org/llama.cpp:${GF_LLAMA_SERVER_VERSION:-server-vulkan}
    container_name: glacierflow-llamacpp
    ports:
      - "8080:8080"
    volumes:
      - ${GF_MODELS_DIRECTORY:-./../../data/models}:/models:ro
    command: >
      --drop 'compose.override.yml' into this directory
    restart: no
    deploy:
      resources:
        limits:
          memory: ${GF_LLAMA_MEMORY_LIMIT:-50g}
    logging:
      driver: json-file
      options:
          max-size: "5m"
          max-file: "2"

services:
  glacierflow-web-ui:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: "glacierflow-web-ui"
    environment:
      - GIN_MODE=release
      - GF_PI_DEV_TTYD_PORT=${GF_PI_DEV_TTYD_PORT:-7681}
      - GF_HERMES_TTYD_PORT=${GF_HERMES_TTYD_PORT:-7682}
      - GF_HERMES_WEB_PORT=${GF_HERMES_WEB_PORT:-7683}
    volumes:
      - ./:/app
      - ./../../data/shared:/app/shared:rw
    restart: no
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

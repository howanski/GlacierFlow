services:
  glacierflow-proxy:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: "glacierflow-proxy"
    ports:
      - "8070:8080"
    volumes:
      - ./:/app
    restart: no
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/proxy-health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
